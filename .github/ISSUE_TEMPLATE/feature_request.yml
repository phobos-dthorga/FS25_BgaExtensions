name: Feature Request
description: Suggest a BGA extension, balance change, or usability improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate Check
      description: Please search open and closed issues before creating a new request.
      options:
        - label: I checked existing issues and this is majorly new or unique.
          required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this improve for players?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or change.
    validations:
      required: true
  - type: textarea
    id: gameplay-impact
    attributes:
      label: Gameplay Impact
      description: How would this affect balance, realism, progression, multiplayer, or compatibility?
    validations:
      required: false
